<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Expenses Tracker</title>  
    <link rel="stylesheet" href="/static/css/styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="security_question1"><i class="fas fa-question-circle"></i> Security Question 1</label>
                <select name="security_question1" required>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What is your favorite color?">What is your favorite color?</option>
                    <option value="What was the name of your elementary school?">What was the name of your elementary school?</option>
                </select>
                <input type="text" name="security_answer1" placeholder="Answer to Security Question 1" required>
            </div>
            <div class="form-group">
                <label for="security_question2"><i class="fas fa-question-circle"></i> Security Question 2</label>
                <select name="security_question2" required>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                    <option value="Where were you born?">Where were you born?</option>
                    <option value="What is your favorite sport?">What is your favorite sport?</option>
                    <option value="What is your father's middle name?">What is your father's middle name?</option>
                </select>
                <input type="text" name="security_answer2" placeholder="Answer to Security Question 2" required>
            </div>
            <div class="form-group">
                <label for="new_password"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
            </div>
            <div class="form-group">                
                <label for="confirm_new_password"><i class="fas fa-lock"></i> Confirm New Password</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" placeholder="Confirm your new password" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <p>Back to Login <a href="/login">Login here</a></p>
    </div>
    <script src="/static/js/resetpassword.js"></script>
</body>
</html>
